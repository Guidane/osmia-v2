{% extends "base.html" %}
{% block title %}Log in · Osmia{% endblock %}
{% block content %}
<div class="card login">
  <span class="brand">▦ Osmia</span>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="field">{{ form.username.label_tag }} {{ form.username }}</div>
    <div class="field">{{ form.password.label_tag }} {{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" style="width:100%">Log in</button>
  </form>
</div>
{% endblock %}
