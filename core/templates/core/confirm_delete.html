{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Delete {{ object }}?</h1>
  <p>This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="btn danger">Delete</button>
      <a class="btn" href="{{ object.get_absolute_url }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
