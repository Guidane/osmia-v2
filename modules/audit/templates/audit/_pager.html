{% if is_paginated %}
<div class="pager">
  {% if page_obj.has_previous %}<a class="btn small" href="?{{ page_query }}page={{ page_obj.previous_page_number }}">‹ Newer</a>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} entries</span>
  {% if page_obj.has_next %}<a class="btn small" href="?{{ page_query }}page={{ page_obj.next_page_number }}">Older ›</a>{% endif %}
</div>
{% endif %}
