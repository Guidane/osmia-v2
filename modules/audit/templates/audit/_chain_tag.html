{% load audit_tags %}{% if e.triggered_by %}<a class="chain-tag" href="{{ e.chain_url }}" title="Changed by {{ e.triggered_by|module_title }}{% if e.chain_path %} (chain: {{ e.chain_path }}){% endif %}{% if e.source %}, {{ e.source }}{% endif %}. Click to trace the chain.">⛓ {{ e.triggered_by|module_title }} <span class="chain-id">#{{ e.chain_id }}</span></a>{% elif e.chain_id %}<a class="chain-id muted" href="{{ e.chain_url }}" title="Everything done in the same go">#{{ e.chain_id }}</a>{% endif %}
